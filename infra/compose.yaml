name: ${COMPOSE_PROJECT_NAME:-ca-meta}

x-api-environment: &api-environment
  NODE_ENV: ${NODE_ENV:-production}
  API_PORT: "${API_PORT:-3000}"
  API_BIND_ADDRESS: ${API_BIND_ADDRESS:-0.0.0.0}
  API_ALLOWED_HOSTS: ${API_ALLOWED_HOSTS:?Set an exact comma-separated host allowlist}
  API_ALLOWED_ORIGINS: ${API_ALLOWED_ORIGINS:?Set an exact comma-separated browser-origin allowlist}
  API_PORTAL_SESSION_RECOVERY_KEY: ${API_PORTAL_SESSION_RECOVERY_KEY:?Set a protected 32-byte-or-longer session recovery key}
  API_TRUSTED_PROXIES: ${API_TRUSTED_PROXIES:-none}
  API_PLATFORM_IDENTITY_ADMIN_IDENTITIES_JSON: ${API_PLATFORM_IDENTITY_ADMIN_IDENTITIES_JSON:-[]}
  API_DATABASE_HOST: ${API_DATABASE_HOST:?Set the private or managed MariaDB host}
  API_DATABASE_PORT: "${API_DATABASE_PORT:-3306}"
  API_DATABASE_NAME: ${API_DATABASE_NAME:?Set the application database name}
  API_DATABASE_USER: ${API_DATABASE_USER:?Set the least-privilege runtime user}
  API_DATABASE_PASSWORD_FILE: /run/secrets/api_database_password
  API_DATABASE_CONNECT_TIMEOUT_MS: "${API_DATABASE_CONNECT_TIMEOUT_MS:-3000}"

services:
  web:
    image: ${CA_META_WEB_IMAGE:-local/ca-meta-web:dev}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - target: 8080
        published: "${WEB_PUBLISH_PORT:-8080}"
        host_ip: ${WEB_PUBLISH_ADDRESS:-0.0.0.0}
        protocol: tcp
    networks:
      - edge
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M

  api:
    image: ${CA_META_API_IMAGE:-local/ca-meta-api:dev}
    command:
      - sh
      - -ec
      - export API_DATABASE_PASSWORD="$$(cat /run/secrets/api_database_password)"; exec node dist/main.js
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment: *api-environment
    secrets:
      - api_database_password
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - edge
      - internal
      - outbound
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const host=(process.env.API_ALLOWED_HOSTS||'').split(',')[0].trim();
          if(!host)process.exit(1);
          require('node:http').get({hostname:'127.0.0.1',port:Number(process.env.API_PORT||3000),path:'/ready',headers:{host}},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M

  worker:
    image: ${CA_META_API_IMAGE:-local/ca-meta-api:dev}
    command:
      - sh
      - -ec
      - export API_DATABASE_PASSWORD="$$(cat /run/secrets/api_database_password)"; exec node dist/worker/main.js
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment: *api-environment
    secrets:
      - api_database_password
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - internal
      - outbound
    healthcheck:
      disable: true
    stop_grace_period: 2m
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M

  migrate:
    image: ${CA_META_API_IMAGE:-local/ca-meta-api:dev}
    command:
      - sh
      - -ec
      - export MIGRATION_DATABASE_PASSWORD="$$(cat /run/secrets/migration_database_password)"; exec node dist/database/migrations/cli.js deploy
    restart: "no"
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      MIGRATION_DATABASE_HOST: ${API_DATABASE_HOST:?Set the private or managed MariaDB host}
      MIGRATION_DATABASE_PORT: "${API_DATABASE_PORT:-3306}"
      MIGRATION_DATABASE_NAME: ${API_DATABASE_NAME:?Set the application database name}
      MIGRATION_DATABASE_USER: ${MIGRATION_DATABASE_USER:?Set the least-privilege migrator user}
      MIGRATION_DATABASE_PASSWORD_FILE: /run/secrets/migration_database_password
      MIGRATION_DATABASE_CONNECT_TIMEOUT_MS: "${MIGRATION_DATABASE_CONNECT_TIMEOUT_MS:-10000}"
      MIGRATION_LOCK_TIMEOUT_SECONDS: "${MIGRATION_LOCK_TIMEOUT_SECONDS:-30}"
      MIGRATION_STATEMENT_TIMEOUT_SECONDS: "${MIGRATION_STATEMENT_TIMEOUT_SECONDS:-300}"
      MIGRATION_MIN_SUPPORTED_API_VERSION: "${MIGRATION_MIN_SUPPORTED_API_VERSION:-1}"
      API_DATABASE_USER: ${API_DATABASE_USER:?Set the least-privilege runtime user}
    secrets:
      - migration_database_password
    networks:
      - internal
      - outbound
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M

networks:
  edge:
    driver: bridge
  internal:
    internal: true
  outbound:
    driver: bridge

secrets:
  api_database_password:
    file: ${CA_META_API_DB_PASSWORD_FILE:?Set the external runtime-password file path}
  migration_database_password:
    file: ${CA_META_MIGRATOR_DB_PASSWORD_FILE:?Set the external migration-password file path}
