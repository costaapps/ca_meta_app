worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format m3_safe '$uri $status';
    access_log /dev/stdout m3_safe;
    server_tokens off;
    sendfile on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /runtime-config.js {
            alias /tmp/runtime-config.js;
            default_type application/javascript;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
        }

        location = /index.html {
            # OAuth SPA callback locations internally redirect here, so keep the
            # original query-bearing request line out of this location's error log too.
            error_log /dev/null emerg;
            include /tmp/embed-policy.conf;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            try_files $uri =404;
        }

        location ~* \.map$ {
            return 404;
        }

        # Angular's production output hashes bundle names. Only those files get immutable caching.
        location ~* "^/.+-[A-Za-z0-9_-]{8,}\.(?:js|css|woff2|ttf|svg|png|jpg|jpeg|webp)$" {
            try_files $uri =404;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location = /api {
            return 308 /api/;
        }

        location = /api/v1 {
            return 308 /api/v1/;
        }

        # Health routes live outside Nest's /api/v1 prefix; map only these exact paths.
        location = /api/health {
            client_max_body_size 64k;
            proxy_pass http://api:3000/health;
        }

        location = /api/ready {
            client_max_body_size 64k;
            proxy_pass http://api:3000/ready;
        }

        location = /api/v1/health {
            client_max_body_size 64k;
            proxy_pass http://api:3000/health;
        }

        location = /api/v1/ready {
            client_max_body_size 64k;
            proxy_pass http://api:3000/ready;
        }

        # Proposed signed webhook contract permits a raw body up to 1 MiB. Keep its URI and bytes unchanged.
        location ~ ^/api/v1/webhooks/meta/[^/]+$ {
            client_max_body_size 1m;
            proxy_pass http://api:3000;
        }

        # Other business paths retain their complete /api/v1 URI and request body.
        # Nginx error messages may include the original request line, which can contain
        # provider callback code/state query values. Suppress request-level errors on both
        # the browser return and API callback; access logging still records only URI/status.
        location = /oauth/return {
            error_log /dev/null emerg;
            include /tmp/embed-policy.conf;
            try_files $uri $uri/ /index.html;
        }

        location ~ ^/setup/(?:callback|(?:whatsapp|facebook|instagram)/callback)$ {
            error_log /dev/null emerg;
            include /tmp/embed-policy.conf;
            try_files $uri $uri/ /index.html;
        }

        location ~ ^/api/v1/meta/[^/]+/callback$ {
            error_log /dev/null emerg;
            client_max_body_size 64k;
            proxy_pass http://api:3000;
        }

        location /api/v1/ {
            client_max_body_size 64k;
            proxy_pass http://api:3000;
        }

        location /api/ {
            client_max_body_size 64k;
            proxy_pass http://api:3000;
        }

        # All non-API routes remain under Angular's router, including callback aliases.
        location / {
            include /tmp/embed-policy.conf;
            try_files $uri $uri/ /index.html;
        }
    }
}
