name: Meta v2 - orchestrator

on:
  pull_request:
    branches: [develop, 'automation/milestone-*', 'desktop/milestone-*']
  push:
    branches: [develop, 'automation/**', 'feat/codex-*']
    paths:
      - 'AGENTS.md'
      - '.codex/**'
      - 'execution/**'
      - 'tools/orchestrator/**'
      - 'docs/execution/**'
      - '.planning/**'
      - '.github/workflows/meta-v2-orchestrator-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meta-v2-orchestrator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  orchestrator:
    name: orchestrator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify Python runtime
        run: python3 -c 'import sys; assert sys.version_info >= (3, 11), sys.version'
      - name: Validate execution policy and canonical catalog
        run: python3 -m tools.orchestrator validate
      - name: Check source syntax
        run: python3 -m compileall -q tools/orchestrator
      - name: Reject implicit locale-dependent text decoding
        run: |
          python3 -X warn_default_encoding -W error::EncodingWarning -m tools.orchestrator validate
          python3 -X warn_default_encoding -W error::EncodingWarning .planning/validate.py
      - name: Exercise orchestration without credentials or external effects
        run: python3 -m unittest discover -s tools/orchestrator/tests -v
      - name: Preserve planning consistency
        run: python3 .planning/validate.py
      - name: Verify planning maintenance tests
        run: python3 -m unittest discover -s .planning -p test_planning.py -v
