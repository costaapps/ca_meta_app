name: Desktop candidate validation

on:
  pull_request:
    branches: [develop, 'desktop/milestone-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    name: desktop-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - name: Checkout candidate, not historical baseline
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.22.1
          cache: npm
      - name: Install candidate dependencies
        run: npm ci --ignore-scripts
      - name: Build candidate
        run: npm run build
      - name: Test candidate
        run: npm test -- --watch=false
