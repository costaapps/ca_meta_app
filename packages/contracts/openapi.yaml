components:
  securitySchemes:
    portalSession:
      type: apiKey
      in: cookie
      name: __Host-meta_portal
      description: Opaque host-only Secure HttpOnly portal session. The cookie value
        is never a DTO field.
    preAuthCookie:
      type: apiKey
      in: cookie
      name: __Host-meta_preauth
      description: Browser-bound pre-auth cookie, distinct from the portal session and
        from any provider code.
  parameters:
    Origin:
      name: Origin
      in: header
      required: true
      description: Exact configured browser Origin; wildcard matching is forbidden.
      schema:
        type: string
        format: uri
        maxLength: 512
      example: https://portal.example.invalid
    FetchSite:
      name: Sec-Fetch-Site
      in: header
      required: true
      description: Must match the configured exact-origin topology; cross-site,
        missing or invalid values fail.
      schema:
        type: string
        enum:
          - same-origin
          - same-site
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Session-bound anti-CSRF value; not a DTO property and not
        sufficient without the session cookie.
      schema:
        type: string
        minLength: 16
        maxLength: 512
    TenantContext:
      name: X-Tenant-Context
      in: header
      required: true
      description: Opaque current context reference returned by the session. It is not
        authorization without the cookie and current server membership.
      schema:
        type: string
        minLength: 16
        maxLength: 512
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Random caller-generated request key; server scope is current tenant
        + operation + key. Same payload hash replays prior acceptance; different
        payload hash returns 409 with no new effect.
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: ^[A-Za-z0-9._~-]+$
      example: idem_example_key_01
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag from the latest representation. Missing/stale precondition is
        rejected; no blind overwrite.
      schema:
        type: string
        minLength: 1
        maxLength: 128
      example: '"automation-v7"'
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque tenant-bound continuation cursor; do not parse or edit.
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      description: Page size, default 50, maximum 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    ProviderSignature:
      name: X-Hub-Signature-256
      in: header
      required: true
      description: Provider signature over exact raw request bytes. Supported
        algorithm/header configuration must be ratified for the actual app.
      schema:
        type: string
        minLength: 16
        maxLength: 512
  schemas:
    ErrorAction:
      type: string
      enum:
        - SIGN_IN
        - FIX_REQUEST
        - CONTACT_ADMIN
        - REFRESH
        - RESTART_ONBOARDING
        - REAUTHORIZE
        - WAIT
        - CHECK_STATUS
        - RECONCILE
        - USE_NEW_REQUEST_KEY
        - REDUCE_REQUEST
        - RELOAD_PORTAL
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required:
        - code
        - safeMessage
        - requestId
        - retryable
        - action
      properties:
        code:
          type: string
          enum:
            - AUTH_REQUIRED
            - MEMBERSHIP_REVOKED
            - ACCESS_DENIED
            - RESOURCE_NOT_AVAILABLE
            - STATE_INVALID
            - ONBOARDING_EXPIRED
            - FLOW_UNAVAILABLE
            - FLOW_NOT_ELIGIBLE
            - ASSET_GRANT_MISSING
            - ASSET_CONFLICT
            - META_PERMISSION_REQUIRED
            - META_REAUTH_REQUIRED
            - META_RATE_LIMITED
            - SUBSCRIPTION_PENDING
            - OUTCOME_UNKNOWN
            - VERSION_CONFLICT
            - IDEMPOTENCY_KEY_REUSED
            - CONTEXT_CHANGED
            - ORIGIN_NOT_ALLOWED
            - HOST_NOT_ALLOWED
            - CSRF_INVALID
            - VALIDATION_FAILED
            - PAYLOAD_TOO_LARGE
            - RATE_LIMITED
            - DEPENDENCY_UNAVAILABLE
            - META_UNAVAILABLE
            - PROVIDER_REJECTED
            - INTERNAL_ERROR
        safeMessage:
          type: string
          minLength: 1
          maxLength: 240
          description: Fixed, allowlisted localization template selected by error code.
            Never interpolate raw provider detail, request values, secrets, or
            diagnostic text.
        requestId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9_-]{1,128}$
          description: Server-generated correlation identifier. Direct-client X-Request-Id
            values are ignored; this identifier is not authorization evidence.
        retryable:
          type: boolean
        action:
          $ref: "#/components/schemas/ErrorAction"
      x-error-policy-by-code:
        OUTCOME_UNKNOWN:
          retryable: false
          action: CHECK_STATUS
        IDEMPOTENCY_KEY_REUSED:
          retryable: false
          action: USE_NEW_REQUEST_KEY
        HOST_NOT_ALLOWED:
          retryable: false
          action: CONTACT_ADMIN
        INTERNAL_ERROR:
          retryable: false
          action: CONTACT_ADMIN
    AcceptedRequest:
      type: object
      additionalProperties: false
      required:
        - accepted
        - requestId
      properties:
        accepted:
          type: boolean
          const: true
        requestId:
          type: string
          minLength: 1
          maxLength: 128
    PreauthStartRequest:
      type: object
      additionalProperties: false
      required:
        - entryMode
        - returnRoute
      properties:
        entryMode:
          type: string
          enum:
            - PORTAL_TOP_LEVEL
            - SUITE4_EMBED
        returnRoute:
          type: string
          enum:
            - connections
            - setup
    PreauthChallenge:
      type: object
      additionalProperties: false
      required:
        - challengeRef
        - expiresAt
        - requestId
      properties:
        challengeRef:
          type: string
          minLength: 16
          maxLength: 128
        expiresAt:
          type: string
          format: date-time
        requestId:
          type: string
          minLength: 1
          maxLength: 128
    PortalEntryExchangeRequest:
      type: object
      additionalProperties: false
      required:
        - ticket
        - challengeRef
      properties:
        ticket:
          type: string
          minLength: 16
          maxLength: 8192
          writeOnly: true
          description: Short-lived Suite4 portal-entry ticket; never a Meta authorization
            code.
        challengeRef:
          type: string
          minLength: 16
          maxLength: 128
    MagicLinkRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    MagicLinkConsumeRequest:
      type: object
      additionalProperties: false
      required:
        - linkToken
      properties:
        linkToken:
          type: string
          minLength: 32
          maxLength: 512
          writeOnly: true
    SessionContext:
      type: object
      additionalProperties: false
      required:
        - principalRef
        - tenantRef
        - roles
        - tenantContextRef
        - contextVersion
        - requestId
      properties:
        sessionRef:
          type: string
          format: uuid
          description: Public opaque selector only; never a credential and insufficient to
            authorize revocation.
        principalRef:
          type: string
          minLength: 1
          maxLength: 128
        tenantRef:
          type: string
          minLength: 1
          maxLength: 128
        roles:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          items:
            type: string
            enum:
              - owner
              - admin
              - operator
              - viewer
        tenantContextRef:
          type: string
          minLength: 16
          maxLength: 512
          description: Session-bound context reference; does not authorize independently.
        contextVersion:
          type: integer
          minimum: 1
        requestId:
          type: string
          minLength: 1
          maxLength: 128
        availableTenants:
          type: array
