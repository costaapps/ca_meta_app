          maxLength: 128
    WebhookChallengeResponse:
      type: object
      additionalProperties: false
      required:
        - challenge
      properties:
        challenge:
          type: string
          maxLength: 1024
    ProviderWebhookEnvelope:
      type: object
      description: Raw, signature-verified provider JSON body. This schema asserts
        only an object shape and a maximum property count; it is not closed or a
        field-level provider schema. Exact Meta webhook fields are Not
        confirmed. Ingress validates signature and size, then stores protected
        bytes. Do not use this schema as an internal event or public read DTO.
      additionalProperties: true
      maxProperties: 256
    HealthStatus:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
            - unavailable
  responses:
    BadRequest:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            sanitized: &a40
              summary: Invalid input, redacted
              value:
                code: VALIDATION_FAILED
                safeMessage: Check the submitted fields.
                requestId: req_example_01
                retryable: false
                action: FIX_REQUEST
    Unauthorized:
      description: Authentication or one-time proof is required. For ticket exchange
        this includes a mismatched pre-auth cookie/challenge or an
        expired/revoked session, membership, or tenant; a response-loss retry is
        accepted only for the same still-active session and browser binding.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            sanitized:
              summary: No portal session
              value:
                code: AUTH_REQUIRED
                safeMessage: Sign in to continue.
                requestId: req_example_02
                retryable: false
                action: SIGN_IN
    Forbidden:
      description: The current identity or request host is not allowed to perform this
        action.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            sanitized:
              summary: Authenticated caller lacks this operation role
              value:
                code: ACCESS_DENIED
                safeMessage: This action is not available for the current account.
                requestId: req_example_03
                retryable: false
                action: CONTACT_ADMIN
            hostNotAllowed:
              summary: Request Host is missing or is not configured
              value:
                code: HOST_NOT_ALLOWED
                safeMessage: This request host is not allowed.
                requestId: req_example_44
                retryable: false
                action: CONTACT_ADMIN
    NotFound:
      description: The resource is unavailable in this tenant; foreign-resource
        existence is not disclosed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            sanitized:
              summary: Resource unavailable in the current tenant
              value:
                code: RESOURCE_NOT_AVAILABLE
                safeMessage: The requested resource is not available.
                requestId: req_example_04
                retryable: false
                action: REFRESH
    Conflict:
      description: The operation conflicts with recorded state or idempotency key.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            sanitized:
              summary: Same idempotency key, different payload
              value:
                code: IDEMPOTENCY_KEY_REUSED
                safeMessage: This request key was already used for a different request.
                requestId: req_example_05
                retryable: false
                action: USE_NEW_REQUEST_KEY
    PreconditionFailed:
      description: The supplied ETag is missing or stale.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            sanitized:
              summary: Stale version
              value:
                code: VERSION_CONFLICT
                safeMessage: The resource changed. Refresh before trying again.
                requestId: req_example_06
                retryable: true
                action: REFRESH
    MethodNotAllowed:
      description: This route does not support the requested method.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            sanitized: *a40
    PayloadTooLarge:
      description: The payload exceeds the endpoint limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            sanitized:
              summary: Request exceeded its configured size limit
              value:
                code: PAYLOAD_TOO_LARGE
                safeMessage: The submitted content is too large.
                requestId: req_example_07
                retryable: false
                action: REDUCE_REQUEST
    Unprocessable:
      description: The requested transition is not allowed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            sanitized:
              summary: Flow state cannot be used
              value:
                code: STATE_INVALID
                safeMessage: This authorization step is no longer valid.
                requestId: req_example_08
                retryable: false
                action: RESTART_ONBOARDING
            flowNotEligible:
              summary: Fresh server evidence says this configured flow is not eligible
              value:
                code: FLOW_NOT_ELIGIBLE
                safeMessage: This configured flow is not currently available for the selected
                  account.
                requestId: req_example_42
                retryable: false
                action: CONTACT_ADMIN
    TooManyRequests:
      description: The configured rate limit was exceeded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            sanitized:
              summary: Operation quota reached
              value:
                code: RATE_LIMITED
                safeMessage: Wait before trying this action again.
                requestId: req_example_09
                retryable: true
                action: WAIT
    Unavailable:
      description: A dependency is unavailable or outcome must be checked.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            sanitized:
              summary: A dependency is unavailable
              value:
                code: DEPENDENCY_UNAVAILABLE
                safeMessage: The operation could not be confirmed yet.
                requestId: req_example_10
                retryable: true
                action: CHECK_STATUS
            metaUnavailable:
              summary: Provider dependency is unavailable
              value:
                code: META_UNAVAILABLE
                safeMessage: Provider status could not be checked yet.
                requestId: req_example_43
                retryable: true
                action: CHECK_STATUS
    UnexpectedError:
      description: An unexpected internal error occurred. Retry is not authorized
        without an operation-specific decision.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            sanitized:
              summary: An unexpected internal error
              value:
                code: INTERNAL_ERROR
                safeMessage: The service could not complete this request.
                requestId: req_example_45
                retryable: false
                action: CONTACT_ADMIN
  examples: {}
