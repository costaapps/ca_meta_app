  /api/v1/auth/preauth:
    post:
      operationId: startPreauth
      tags:
        - Authentication
      summary: Start browser-bound pre-authentication
      description: Public before a portal session. Requires an exact allowlisted
        Origin, matching Fetch Metadata, and an HttpOnly pre-auth cookie bound
        to the server-created challenge. The challenge is for a trusted
        portal-entry handoff, not a Meta provider code. PORTAL_TOP_LEVEL uses a
        SameSite=Lax host-only cookie. SUITE4_EMBED is enabled only when an
        exact HTTPS Suite4 parent-origin allowlist is configured; its host-only
        pre-auth cookie is SameSite=None, Secure and Partitioned. The browser
        still must pass the exact portal/app Origin and same-origin Fetch
        Metadata checks. Empty embed-origin configuration rejects SUITE4_EMBED
        with 400.
