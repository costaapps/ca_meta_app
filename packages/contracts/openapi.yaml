info:
  title: Msg4 Meta Connections API
  version: 1.0.0-proposed
  summary: Proposed, versioned API contract for Meta connection management.
  description: This contract is proposed for M1.07 and does not describe a
    deployed service. Production PHP routing, Suite4 issuer claims, Meta grants,
    flow eligibility, provider callback details, and deployment behavior are Not
    confirmed. Every route is deny-by-default. Tenant and actor authority come
    from the authenticated server context; company_uuid is never authorization
    input.
  contact:
    name: Msg4 Meta Platform API
servers:
  - url: https://api.example.invalid
    description: Root-host placeholder; the actual deployment host is Not confirmed.
security: &a10
  - portalSession: []
x-status: proposed
x-public-routes:
  - method: POST
    path: /api/v1/auth/preauth
    purpose: Start a browser-bound pre-auth challenge; exact Origin and Fetch
      Metadata are required.
  - method: POST
    path: /api/v1/auth/exchanges
    purpose: Exchange a trusted, one-time portal-entry ticket plus its pre-auth
      cookie; it does not accept provider authorization codes.
  - method: POST
    path: /api/v1/auth/magic-links
    purpose: Uniform, rate-limited request for an already-invited identity; never
      creates membership.
  - method: GET
    path: /api/v1/auth/magic-links/confirm
    purpose: Public scanner-safe confirmation page; its short-lived link token is
      the capability, and GET never consumes or creates a session.
  - method: HEAD
    path: /api/v1/auth/magic-links/confirm
    purpose: Public scanner probe; HEAD never looks up or consumes a link and never
      creates a session.
  - method: POST
    path: /api/v1/auth/magic-links/consume
    purpose: Explicit one-use magic-link confirmation; GET/HEAD never consume it.
  - method: GET
    path: /api/v1/meta/{variant}/callback
    purpose: Provider callback keyed by server-created onboarding state; no tenant
      query parameter is trusted.
  - method: GET
    path: /api/v1/webhooks/meta/{appConfigRef}
    purpose: Signature-verified provider webhook handshake; exact provider semantics
      remain Not confirmed.
  - method: POST
    path: /api/v1/webhooks/meta/{appConfigRef}
    purpose: Signature-verified, size-bounded provider webhook ingress; routing is
      resolved server-side.
  - method: GET
    path: /health
    purpose: Non-sensitive liveness only.
  - method: GET
    path: /ready
    purpose: Non-sensitive readiness summary; no provider call.
x-proposed-payload-limits:
  defaultJsonRequestBytes: 65536
