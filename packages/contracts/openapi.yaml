              sanitized:
                summary: Sanitized request example
                value:
                  entryMode: PORTAL_TOP_LEVEL
                  returnRoute: connections
      responses:
        "201":
          description: Sanitized success example
          headers:
            Set-Cookie:
              description: Host-only Secure HttpOnly `__Host-meta_preauth` cookie with no
                Domain attribute. PORTAL_TOP_LEVEL uses SameSite=Lax; configured
                SUITE4_EMBED uses SameSite=None; Partitioned. Cookie value is
                not in the response body.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreauthChallenge"
              examples:
                sanitized:
                  summary: Sanitized success example
                  value:
                    challengeRef: preauth_example_01
                    expiresAt: 2026-10-29T12:00:30Z
                    requestId: req_example_13
