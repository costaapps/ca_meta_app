services:
  db:
    image: mariadb:11.8.8@sha256:d9f7eb2637296652f24b484afd5d246f759f49f5babcadc6a9e344c9acb75fbf
    environment:
      MARIADB_DATABASE: m106_identity
      MARIADB_USER: m106_test
      MARIADB_PASSWORD: ${M106_DB_PASSWORD:?Set a disposable M106_DB_PASSWORD for this run}
      MARIADB_ROOT_PASSWORD: ${M106_DB_PASSWORD:?Set a disposable M106_DB_PASSWORD for this run}
      TZ: UTC
    command: ["--default-time-zone=+00:00"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
    volumes:
      - m106-db-data:/var/lib/mysql
    restart: "no"
  poc:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      M106_DB_HOST: db
      M106_DB_PORT: "3306"
      M106_DB_USER: m106_test
      M106_DB_PASSWORD: ${M106_DB_PASSWORD:?Set a disposable M106_DB_PASSWORD for this run}
      M106_DB_NAME: m106_identity
      TZ: UTC
    volumes:
      - ../../docs/baseline/endpoint-matrix.csv:/workspace/input/endpoint-matrix.csv:ro
      - ../../docs/meta-v2/endpoint-security-crosswalk.csv:/workspace/input/endpoint-security-crosswalk.csv:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  m106-db-data:
