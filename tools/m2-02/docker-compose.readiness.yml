services:
  db:
    image: mariadb:11.8.8@sha256:d9f7eb2637296652f24b484afd5d246f759f49f5babcadc6a9e344c9acb75fbf
    restart: "no"
    environment:
      MARIADB_ROOT_PASSWORD: ${M2_02_DB_ROOT_PASSWORD:?M2_02_DB_ROOT_PASSWORD must be set}
      MARIADB_DATABASE: ${M2_02_DB_NAME:?M2_02_DB_NAME must be set}
      MARIADB_USER: ${M2_02_DB_USER:?M2_02_DB_USER must be set}
      MARIADB_PASSWORD: ${M2_02_DB_PASSWORD:?M2_02_DB_PASSWORD must be set}
    ports:
      - "127.0.0.1:${M2_02_DB_HOST_PORT:?M2_02_DB_HOST_PORT must be set}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
