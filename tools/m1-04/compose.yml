services:
  db:
    image: mariadb@sha256:d9f7eb2637296652f24b484afd5d246f759f49f5babcadc6a9e344c9acb75fbf
    environment:
      MARIADB_DATABASE: m104_poc
      MARIADB_USER: m104_poc
      MARIADB_PASSWORD: ${M104_DB_PASSWORD:?Set a disposable M104_DB_PASSWORD for this run}
      MARIADB_ROOT_PASSWORD: ${M104_DB_PASSWORD:?Set a disposable M104_DB_PASSWORD for this run}
      TZ: UTC
    command: ["--default-time-zone=+00:00"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
    volumes:
      - m104-db-data:/var/lib/mysql
    restart: "no"
  poc:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: m104_poc
      DB_PASSWORD: ${M104_DB_PASSWORD:?Set a disposable M104_DB_PASSWORD for this run}
      DB_NAME: m104_poc
      TZ: UTC
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  m104-db-data:
