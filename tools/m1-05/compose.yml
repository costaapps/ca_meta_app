services:
  db:
    image: mariadb:11.8.8@sha256:d9f7eb2637296652f24b484afd5d246f759f49f5babcadc6a9e344c9acb75fbf
    environment:
      MARIADB_DATABASE: m105_domain
      MARIADB_USER: m105_test
      MARIADB_PASSWORD: ${M105_DB_PASSWORD:?Set a disposable M105_DB_PASSWORD for this run}
      MARIADB_ROOT_PASSWORD: ${M105_DB_PASSWORD:?Set a disposable M105_DB_PASSWORD for this run}
      TZ: UTC
    command: ["--default-time-zone=+00:00"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
    volumes:
      - m105-db-data:/var/lib/mysql
    restart: "no"
  poc:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      M105_DB_HOST: db
      M105_DB_PORT: "3306"
      M105_DB_USER: m105_test
      M105_DB_PASSWORD: ${M105_DB_PASSWORD:?Set a disposable M105_DB_PASSWORD for this run}
      M105_DB_NAME: m105_domain
      TZ: UTC
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  m105-db-data:
