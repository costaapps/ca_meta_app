services:
  mariadb:
    image: mariadb:11.8.8@sha256:d9f7eb2637296652f24b484afd5d246f759f49f5babcadc6a9e344c9acb75fbf
    environment:
      MARIADB_ROOT_PASSWORD: ${M2_ROOT_PASSWORD:?set M2_ROOT_PASSWORD}
      MARIADB_DATABASE: ca_meta_m205
    ports:
      - "127.0.0.1:${M2_DB_PORT:?set M2_DB_PORT}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - type: bind
        source: ${M2_INIT_SQL_PATH:?set M2_INIT_SQL_PATH}
        target: /docker-entrypoint-initdb.d/01-m2-05-init.sql
        read_only: true
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 2s
      retries: 60
volumes:
  mariadb_data:
