<div class="portal-shell" [attr.data-theme]="embedSnapshot.theme">
  <header class="portal-header">
    <a class="brand" routerLink="/connections" aria-label="Msg4 Meta, página inicial de conexões">
      <span class="brand-mark" aria-hidden="true">M</span>
      <span>Msg4 <span class="brand-divider">/</span> Meta</span>
    </a>

    <div class="session-summary" *ngIf="session as activeSession">
      <span class="session-state"><span class="state-dot" aria-hidden="true"></span>Sessão ativa</span>
      <span class="tenant-label" role="status">{{ contextLabel }}</span>
      <span class="role-label">{{ activeSession.roles.join(' · ') }}</span>
    </div>

    <button class="sign-out" type="button" (click)="signOut()" [disabled]="isSigningOut">
      {{ isSigningOut ? 'Saindo…' : 'Sair' }}
    </button>
  </header>

  <nav class="portal-nav" aria-label="Navegação principal">
    <a routerLink="/connections" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">Conexões</a>
    <a routerLink="/templates" routerLinkActive="is-active">Modelos</a>
    <a routerLink="/notifications" routerLinkActive="is-active">Notificações</a>
  </nav>

  <main #portalMain class="portal-main">
    <p class="context-notice" *ngIf="notice" role="status">
      {{ notice }} <span *ngIf="noticeRequestId">Referência: {{ noticeRequestId }}</span>
    </p>
    <router-outlet></router-outlet>
  </main>
</div>
